<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090713" />
  <meta name="description" content="A tiny daily streak app for showing up and doing something useful." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Streak Spark</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span> streak spark</div>
      <button class="icon-button" id="resetButton" aria-label="Reset streak" title="Reset streak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.34-5.66L20 7.68M20 3v5h-5"/></svg>
      </button>
    </header>

    <section class="hero" aria-labelledby="streakTitle">
      <p class="eyebrow" id="statusLabel">ready for today?</p>
      <h1 id="streakTitle"><span id="streakCount">0</span><small>day streak</small></h1>

      <button class="streak-button" id="streakButton" aria-describedby="streakHint">
        <span class="rings" aria-hidden="true"></span>
        <span class="flame" aria-hidden="true">
          <svg viewBox="0 0 120 144"><path class="flame-outer" d="M63 4c5 26-13 34-8 54 8-12 19-18 28-34 27 29 34 58 23 83-9 22-29 34-51 33-29-1-49-20-49-48 0-22 14-44 39-67-2 20 5 29 18 34-3-19 13-34 0-55Z"/><path class="flame-inner" d="M61 72c7 12 22 20 17 39-3 12-12 20-24 19-13-1-22-10-21-23 1-11 8-19 19-30-1 11 3 16 9 19-2-9 4-16 0-24Z"/></svg>
        </span>
        <span class="button-copy" id="buttonCopy">i did something useful</span>
      </button>

      <p class="hint" id="streakHint">tap only when you’ve earned it today.</p>
      <div class="celebration" id="celebration" aria-live="polite"></div>
    </section>

    <section class="week-card" aria-labelledby="weekTitle">
      <div class="week-heading">
        <h2 id="weekTitle">this week</h2>
        <span id="weekScore">0 / 7</span>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </section>
  </main>

  <dialog id="resetDialog">
    <form method="dialog">
      <div class="dialog-icon">↻</div>
      <h2>reset your streak?</h2>
      <p>this clears your check-in history on this device. no sneaky undo.</p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">keep it</button>
        <button value="confirm" class="danger">reset</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
