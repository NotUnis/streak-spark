<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="A little fire for showing up every day.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=4">
  <title>Streak Spark</title>
</head>
<body>
  <main>
    <time id="clock" aria-label="Current time">--:--</time>
    <button id="streakButton" aria-label="I did something useful today. Save my streak.">
      <span class="glow" aria-hidden="true"></span>
      <svg class="fire" viewBox="0 0 240 300" aria-hidden="true">
        <defs>
          <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#ffbc70"/><stop offset=".5" stop-color="#ff813d"/><stop offset="1" stop-color="#f44723"/>
          </linearGradient>
          <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#fff6d5"/><stop offset="1" stop-color="#ffc56c"/>
          </linearGradient>
        </defs>
        <path class="body" fill="url(#fire)" d="M130 18 C147 74 96 96 112 146 C129 138 147 117 153 94 C187 123 207 162 204 199 C200 246 165 279 120 279 C74 279 39 248 36 206 C33 174 48 147 74 125 C70 155 82 169 95 174 C69 111 143 83 130 18 Z"/>
        <path class="heart" fill="url(#heart)" d="M126 162 C132 191 157 203 155 228 C153 252 139 267 120 267 C99 267 85 252 86 233 C87 213 105 199 108 180 C114 193 111 204 118 211 C128 196 130 180 126 162 Z"/>
      </svg>
      <span class="embers" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <div class="streak" aria-live="polite"><strong id="streakCount">0</strong><span>day</span></div>
    <p class="sr-only" id="status" role="status"></p>
  </main>
  <script src="app.js?v=4" defer></script>
</body>
</html>
